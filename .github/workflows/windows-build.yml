name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Windows x64 / Python 3.8
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.8
        uses: actions/setup-python@v7
        with:
          python-version: '3.8.10'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pip==24.3.1
          python -m pip install -r requirements-dev.txt

      - name: Build portable package
        shell: pwsh
        run: .\build.ps1 -SkipBootstrap

      - name: Verify release manifest
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $manifest = Get-Content -Raw dist\WinAutomator\version.json | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "Version mismatch: $($manifest.version) != $version" }
          if (-not (Test-Path "dist\WinAutomator-$version-win-x64.zip")) { throw "Portable archive missing." }
          Get-Content dist\SHA256SUMS.txt

      - name: Upload CI package
        uses: actions/upload-artifact@v7
        with:
          name: WinAutomator-${{ github.sha }}-win-x64
          path: |
            dist/WinAutomator-*-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
