name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-package:
    name: Windows x64 release candidate
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.8
        uses: actions/setup-python@v7
        with:
          python-version: '3.8.10'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pip==24.3.1
          python -m pip install -r requirements-dev.txt

      - name: Unit tests
        shell: pwsh
        run: python -m pytest -q

      - name: Real UIA executor E2E
        shell: pwsh
        run: python .\scripts\e2e_ui_test.py

      - name: Build complete offline developer dependencies
        shell: pwsh
        run: |
          .\download-offline-deps.ps1 -Python (Get-Command python).Source -SkipBootstrap
          if (-not (Test-Path 'offline\python-3.8.10-amd64.exe')) { throw 'Python installer missing from offline bundle.' }
          if (-not (Test-Path 'offline\manifest.json')) { throw 'Offline manifest missing.' }
          $manifest = Get-Content -Raw offline\manifest.json | ConvertFrom-Json
          if (@($manifest.files).Count -lt 5) { throw 'Offline manifest has too few payload files.' }
          if ((Get-ChildItem 'offline\wheels' -File).Count -lt 5) { throw 'Offline wheel set is unexpectedly small.' }

      - name: Upload offline developer dependencies for clean runner
        uses: actions/upload-artifact@v7
        with:
          name: WinAutomator-offline-dependencies
          path: offline
          if-no-files-found: error
          retention-days: 7

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build release packages
        shell: pwsh
        run: .\build.ps1 -SkipBootstrap -RequireInstaller

      - name: Verify release manifest, installer and normal GUI launch
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $manifest = Get-Content -Raw dist\WinAutomator\version.json | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "Version mismatch: $($manifest.version) != $version" }
          if ($manifest.network_required -ne $false) { throw 'Packaged app does not declare network_required=false.' }
          if ($manifest.standalone -ne $true) { throw 'Packaged app does not declare standalone=true.' }

          $portable = "dist\WinAutomator-$version-win-x64.zip"
          $setup = "dist\WinAutomator-$version-Setup-win-x64.exe"
          $fullOffline = "dist\WinAutomator-$version-FULL-OFFLINE-win-x64.zip"
          if (-not (Test-Path $portable)) { throw "Portable archive missing: $portable" }
          if (-not (Test-Path $setup)) { throw "Installer missing: $setup" }
          if (-not (Test-Path $fullOffline)) { throw "FULL-OFFLINE archive missing: $fullOffline" }
          if (-not (Test-Path 'dist\SHA256SUMS.txt')) { throw 'SHA256SUMS.txt missing.' }

          $installDir = Join-Path $env:RUNNER_TEMP "WinAutomator-$version-installed"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $installDir
          $installer = (Resolve-Path $setup).Path
          $p = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`""
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer smoke-test failed with exit code $($p.ExitCode)." }

          $installedExe = Join-Path $installDir 'WinAutomator.exe'
          if (-not (Test-Path $installedExe)) { throw "Installed executable missing: $installedExe" }

          foreach ($mode in @('--smoke-test','--smoke-gui')) {
            $reportPath = Join-Path $env:RUNNER_TEMP ((($mode -replace '^--','') -replace '-','_') + '.json')
            Remove-Item -Force -ErrorAction SilentlyContinue $reportPath
            $p = Start-Process -FilePath $installedExe -ArgumentList @($mode, "`"$reportPath`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installed EXE $mode failed with exit code $($p.ExitCode)." }
            if (-not (Test-Path $reportPath)) { throw "Installed EXE $mode did not create report." }
            $report = Get-Content -Raw $reportPath | ConvertFrom-Json
            if (-not $report.ok) { throw "Installed EXE $mode reported failed checks." }
            if ($report.version -ne $version) { throw "Installed version mismatch: $($report.version) != $version" }
          }

          $live = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 3
          if ($live.HasExited) { throw "Normal GUI launch failed with exit code $($live.ExitCode)." }
          Stop-Process -Id $live.Id -Force

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Inno Setup uninstaller is missing.' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($p.ExitCode)." }

          Get-Content dist\SHA256SUMS.txt

      - name: Upload exact end-user candidate for clean runner
        uses: actions/upload-artifact@v7
        with:
          name: WinAutomator-${{ github.sha }}-win-x64
          path: |
            dist/WinAutomator-*-win-x64.zip
            dist/WinAutomator-*-Setup-win-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  offline-deployment:
    name: Strict air-gapped target and developer deployment
    needs: release-package
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout on fresh runner
        uses: actions/checkout@v7

      - name: Download exact end-user release candidate
        uses: actions/download-artifact@v8
        with:
          name: WinAutomator-${{ github.sha }}-win-x64
          path: release-dist

      - name: Strictly prove FULL-OFFLINE target package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $package = "release-dist\WinAutomator-$version-FULL-OFFLINE-win-x64.zip"
          if (-not (Test-Path -LiteralPath $package)) { throw "FULL-OFFLINE candidate missing: $package" }
          .\scripts\verify-airgap-release.ps1 `
            -PackagePath $package `
            -ReportPath "release-dist\AIRGAP-VERIFICATION.json"

      - name: Download offline developer dependencies
        uses: actions/download-artifact@v8
        with:
          name: WinAutomator-offline-dependencies
          path: offline

      - name: Verify developer artifact layout
        shell: pwsh
        run: |
          if (-not (Test-Path 'offline\python-3.8.10-amd64.exe')) { throw 'Python installer missing after artifact download.' }
          if (-not (Test-Path 'offline\manifest.json')) { throw 'Offline manifest missing after artifact download.' }
          if ((Get-ChildItem 'offline\wheels' -File).Count -lt 5) { throw 'Offline wheels missing after artifact download.' }

      - name: Fresh developer bootstrap with network deliberately unavailable
        shell: pwsh
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          PIP_NO_INDEX: '1'
        run: |
          .\bootstrap.ps1 -Offline -NoRun
          if (-not (Test-Path '.runtime\python38\python.exe')) { throw 'Private Python runtime was not installed.' }
          if (-not (Test-Path '.venv\Scripts\python.exe')) { throw 'Offline virtualenv was not created.' }
          .\.venv\Scripts\python.exe .\scripts\self_test.py
          .\.venv\Scripts\python.exe -m pytest -q

      - name: Real UIA E2E from offline developer environment
        shell: pwsh
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          PIP_NO_INDEX: '1'
        run: .\.venv\Scripts\python.exe .\scripts\e2e_ui_test.py

      - name: Rebuild portable package using offline dependencies only
        shell: pwsh
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          PIP_NO_INDEX: '1'
        run: .\build.ps1 -Offline

      - name: Extract and launch offline-rebuilt portable package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $zip = "dist\WinAutomator-$version-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "Offline-built portable archive missing: $zip" }

          $target = Join-Path $env:RUNNER_TEMP 'WinAutomator-portable-target'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $target
          Expand-Archive -LiteralPath $zip -DestinationPath $target
          $exe = Join-Path $target 'WinAutomator\WinAutomator.exe'
          if (-not (Test-Path $exe)) { throw "Portable executable missing after extraction: $exe" }

          foreach ($mode in @('--smoke-test','--smoke-gui')) {
            $reportPath = Join-Path $env:RUNNER_TEMP ("offline-" + (($mode -replace '^--','') -replace '-','_') + '.json')
            Remove-Item -Force -ErrorAction SilentlyContinue $reportPath
            $p = Start-Process -FilePath $exe -ArgumentList @($mode, "`"$reportPath`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Portable EXE $mode failed with exit code $($p.ExitCode)." }
            $report = Get-Content -Raw $reportPath | ConvertFrom-Json
            if (-not $report.ok) { throw "Portable EXE $mode reported failed checks." }
            if ($report.version -ne $version) { throw "Portable version mismatch: $($report.version) != $version" }
          }

          $live = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          if ($live.HasExited) { throw "Portable normal GUI launch failed with exit code $($live.ExitCode)." }
          Stop-Process -Id $live.Id -Force

      - name: Upload offline proof and rebuilt portable package
        uses: actions/upload-artifact@v7
        with:
          name: WinAutomator-${{ github.sha }}-offline-verified
          path: |
            release-dist/WinAutomator-*-FULL-OFFLINE-win-x64.zip
            release-dist/AIRGAP-VERIFICATION.json
            release-dist/SHA256SUMS.txt
            dist/WinAutomator-*-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
