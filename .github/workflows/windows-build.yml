name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install pip==24.3.1
          python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name WinAutomator --paths src --collect-submodules comtypes --hidden-import pywinauto.controls.uiawrapper app.py
          Copy-Item README.md dist\WinAutomator\README.md
          @{ version='0.1.0'; python='3.8'; built_at=(Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json | Set-Content dist\WinAutomator\version.json -Encoding UTF8
          Compress-Archive -Path dist\WinAutomator\* -DestinationPath dist\WinAutomator-win-x64.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: WinAutomator-win-x64
          path: dist/WinAutomator-win-x64.zip
          if-no-files-found: error
