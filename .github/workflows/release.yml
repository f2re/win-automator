name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z.-]+)?$') {
            throw "VERSION is not valid SemVer: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Refuse an existing release/tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists. Bump VERSION instead of rebuilding it." }
          git ls-remote --exit-code --tags origin "refs/tags/$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:TAG already exists. Bump VERSION instead of moving a release tag." }
          $global:LASTEXITCODE = 0

      - name: Python 3.8
        uses: actions/setup-python@v7
        with:
          python-version: '3.8.10'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pip==24.3.1
          python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable package and installer
        shell: pwsh
        run: .\build.ps1 -SkipBootstrap -RequireInstaller -Version "${{ steps.version.outputs.version }}"

      - name: Build air-gapped developer bundle
        shell: pwsh
        run: |
          .\download-offline-deps.ps1 -Python (Get-Command python).Source -SkipBootstrap
          $version = "${{ steps.version.outputs.version }}"
          $stageRoot = Join-Path $PWD "dist\offline-stage"
          $stage = Join-Path $stageRoot "WinAutomator-$version-offline-dev"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          git archive --format=zip HEAD -o dist\source.zip
          Expand-Archive -Path dist\source.zip -DestinationPath $stage -Force
          Copy-Item offline (Join-Path $stage 'offline') -Recurse -Force
          Remove-Item dist\source.zip -Force
          Compress-Archive -Path $stage -DestinationPath "dist\WinAutomator-$version-offline-dev.zip" -Force
          Remove-Item $stageRoot -Recurse -Force

          $assets = Get-ChildItem dist -File | Where-Object {
            $_.Name -like "WinAutomator-$version-*.zip" -or $_.Name -like "WinAutomator-$version-*.exe"
          }
          $lines = foreach ($asset in ($assets | Sort-Object Name)) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ASCII

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/WinAutomator-*-win-x64.zip
            dist/WinAutomator-*-Setup-win-x64.exe
            dist/WinAutomator-*-offline-dev.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $assets = @(
            "dist\WinAutomator-$env:VERSION-win-x64.zip",
            "dist\WinAutomator-$env:VERSION-Setup-win-x64.exe",
            "dist\WinAutomator-$env:VERSION-offline-dev.zip",
            "dist\SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Release asset missing: $asset" }
          }

          $ghArgs = @(
            'release', 'create', $env:TAG,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Win Automator $env:TAG",
            '--generate-notes'
          )
          if ($env:VERSION -match '-') { $ghArgs += '--prerelease' }
          $ghArgs += $assets
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with code $LASTEXITCODE" }

      - name: Upload build log artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}-assets
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
