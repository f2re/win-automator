name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z.-]+)?$') {
            throw "VERSION is not valid SemVer: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Refuse an existing release/tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists. Bump VERSION instead of rebuilding it." }
          git ls-remote --exit-code --tags origin "refs/tags/$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:TAG already exists. Bump VERSION instead of moving a release tag." }
          $global:LASTEXITCODE = 0

      - name: Python 3.8
        uses: actions/setup-python@v7
        with:
          python-version: '3.8.10'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pip==24.3.1
          python -m pip install -r requirements-dev.txt

      - name: Unit and UIA tests
        shell: pwsh
        run: |
          python -m pytest -q
          python .\scripts\e2e_ui_test.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable, installer and FULL-OFFLINE bundle
        shell: pwsh
        run: .\build.ps1 -SkipBootstrap -RequireInstaller -Version "${{ steps.version.outputs.version }}"

      - name: Build air-gapped developer bundle
        shell: pwsh
        run: |
          .\download-offline-deps.ps1 -Python (Get-Command python).Source -SkipBootstrap
          $version = "${{ steps.version.outputs.version }}"
          $stageRoot = Join-Path $PWD "dist\offline-dev-stage"
          $stage = Join-Path $stageRoot "WinAutomator-$version-offline-dev"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          git archive --format=zip HEAD -o dist\source.zip
          Expand-Archive -Path dist\source.zip -DestinationPath $stage -Force
          Copy-Item offline (Join-Path $stage 'offline') -Recurse -Force
          Remove-Item dist\source.zip -Force
          Compress-Archive -Path $stage -DestinationPath "dist\WinAutomator-$version-offline-dev.zip" -Force
          Remove-Item $stageRoot -Recurse -Force

          $assets = Get-ChildItem dist -File | Where-Object {
            $_.Name -like "WinAutomator-$version-*.zip" -or $_.Name -like "WinAutomator-$version-*.exe"
          }
          $lines = foreach ($asset in ($assets | Sort-Object Name)) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ASCII

      - name: Assert release candidate layout
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $required = @(
            "dist\WinAutomator-$version-win-x64.zip",
            "dist\WinAutomator-$version-Setup-win-x64.exe",
            "dist\WinAutomator-$version-FULL-OFFLINE-win-x64.zip",
            "dist\WinAutomator-$version-offline-dev.zip",
            "dist\SHA256SUMS.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Release candidate file missing: $path" }
          }

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: WinAutomator-${{ steps.version.outputs.version }}-release-candidate
          path: |
            dist/WinAutomator-*-win-x64.zip
            dist/WinAutomator-*-Setup-win-x64.exe
            dist/WinAutomator-*-offline-dev.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  airgap-verify:
    name: Prove exact FULL-OFFLINE release candidate
    needs: build
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v7

      - name: Download exact release candidate
        uses: actions/download-artifact@v8
        with:
          name: WinAutomator-${{ needs.build.outputs.version }}-release-candidate
          path: dist

      - name: Strict process-level network block, install and launch
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $package = "dist\WinAutomator-$version-FULL-OFFLINE-win-x64.zip"
          .\scripts\verify-airgap-release.ps1 `
            -PackagePath $package `
            -ReportPath "dist\AIRGAP-VERIFICATION.json"

      - name: Upload air-gap proof
        uses: actions/upload-artifact@v7
        with:
          name: WinAutomator-${{ needs.build.outputs.version }}-airgap-proof
          path: dist/AIRGAP-VERIFICATION.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish only after air-gap proof
    needs: [build, airgap-verify]
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download verified release candidate
        uses: actions/download-artifact@v8
        with:
          name: WinAutomator-${{ needs.build.outputs.version }}-release-candidate
          path: dist

      - name: Download air-gap proof
        uses: actions/download-artifact@v8
        with:
          name: WinAutomator-${{ needs.build.outputs.version }}-airgap-proof
          path: dist

      - name: Add proof hash to SHA256SUMS
        shell: pwsh
        run: |
          $proof = 'dist\AIRGAP-VERIFICATION.json'
          if (-not (Test-Path -LiteralPath $proof)) { throw 'AIRGAP-VERIFICATION.json is missing.' }
          $hash = (Get-FileHash -LiteralPath $proof -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath 'dist\SHA256SUMS.txt' -Value "$hash  AIRGAP-VERIFICATION.json" -Encoding ASCII

      - name: Attest verified release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/WinAutomator-*-win-x64.zip
            dist/WinAutomator-*-Setup-win-x64.exe
            dist/WinAutomator-*-offline-dev.zip
            dist/AIRGAP-VERIFICATION.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: pwsh
        run: |
          $assets = @(
            "dist\WinAutomator-$env:VERSION-FULL-OFFLINE-win-x64.zip",
            "dist\WinAutomator-$env:VERSION-Setup-win-x64.exe",
            "dist\WinAutomator-$env:VERSION-win-x64.zip",
            "dist\WinAutomator-$env:VERSION-offline-dev.zip",
            "dist\AIRGAP-VERIFICATION.json",
            "dist\SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Release asset missing: $asset" }
          }

          $notes = @(
            '## Offline guarantee',
            '',
            "**Recommended download for a machine without Internet:** ``WinAutomator-$env:VERSION-FULL-OFFLINE-win-x64.zip``",
            '',
            'The exact published FULL-OFFLINE archive was verified on a fresh Windows runner before this release was created:',
            '- outbound network blocked for installer and application processes by Windows Firewall;',
            '- HTTP/HTTPS/ALL proxy forced to an unreachable local endpoint;',
            '- system Python removed from PATH;',
            '- embedded manifest and SHA-256 payload verified;',
            '- portable smoke + GUI smoke + normal launch passed;',
            '- silent installer, installed smoke + GUI smoke + normal launch and uninstall passed.',
            '',
            'See `AIRGAP-VERIFICATION.json` and `SHA256SUMS.txt` attached to this release.'
          )
          $notes -join "`r`n" | Set-Content -LiteralPath release-notes.md -Encoding UTF8

          $ghArgs = @(
            'release', 'create', $env:TAG,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Win Automator $env:TAG",
            '--notes-file', 'release-notes.md'
          )
          if ($env:VERSION -match '-') { $ghArgs += '--prerelease' }
          $ghArgs += $assets
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with code $LASTEXITCODE" }

      - name: Upload verified release archive
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.build.outputs.version }}-verified-assets
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.json
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
